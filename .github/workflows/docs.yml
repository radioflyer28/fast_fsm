name: Docs

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "docs/**"
      - "README.md"
  # Also rebuild docs when a GitHub Release is published (after a version tag)
  release:
    types: [published]
  # Allow manual triggering from the Actions tab
  workflow_dispatch:

# Required for GitHub Pages deployment via Actions.
# In your repository go to: Settings → Pages → Source → GitHub Actions
permissions:
  contents: read

# Only one deployment can run at a time; cancel an in-progress run when a new
# push arrives so stale docs are never served.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build_docs:
    name: Build Sphinx docs
    runs-on: ubuntu-latest
    env:
      FAST_FSM_BUILD_MODE: pure
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
        with:
          version: "0.12.6"
          python-version: "3.12"

      - name: Install docs dependencies
        run: uv sync --locked --group docs

      - name: Verify pure source origin
        run: uv run python tools/release_evidence.py verify-source --json

      - name: Build HTML
        run: uv run sphinx-build -b html docs docs/_build/html -W --keep-going

      - name: Verify doctest examples
        run: uv run sphinx-build -b doctest docs docs/_build/doctest

      - name: Configure Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: docs/_build/html

  deploy_docs:
    name: Deploy to GitHub Pages
    needs: build_docs
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    permissions:
      pages: write
      id-token: write
    steps:
      - id: deploy
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
