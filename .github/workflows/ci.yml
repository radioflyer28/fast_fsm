name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  format:
    name: Ruff format
    runs-on: ubuntu-latest
    env:
      FAST_FSM_BUILD_MODE: pure
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
        with:
          version: "0.12.6"
          python-version: "3.12"
      - name: Install pinned Task runner
        uses: arduino/setup-task@c0bc642852239c2689f73f4ea6459c29405f3c52 # v3.0.0
        with:
          version: "3.53.1"
      - name: Install locked quality dependencies
        run: uv sync --locked --all-groups
      - name: Verify pure source origin
        run: uv run python tools/release_evidence.py verify-source --json
      - name: Check formatting
        run: task format-check

  lint:
    name: Ruff lint
    runs-on: ubuntu-latest
    env:
      FAST_FSM_BUILD_MODE: pure
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
        with:
          version: "0.12.6"
          python-version: "3.12"
      - name: Install pinned Task runner
        uses: arduino/setup-task@c0bc642852239c2689f73f4ea6459c29405f3c52 # v3.0.0
        with:
          version: "3.53.1"
      - name: Install locked quality dependencies
        run: uv sync --locked --all-groups
      - name: Verify pure source origin
        run: uv run python tools/release_evidence.py verify-source --json
      - name: Run lint
        run: task lint

  typecheck_mypy:
    name: Mypy compatibility (blocking)
    runs-on: ubuntu-latest
    env:
      FAST_FSM_BUILD_MODE: pure
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
        with:
          version: "0.12.6"
          python-version: "3.12"
      - name: Install pinned Task runner
        uses: arduino/setup-task@c0bc642852239c2689f73f4ea6459c29405f3c52 # v3.0.0
        with:
          version: "3.53.1"
      - name: Install locked quality dependencies
        run: uv sync --locked --all-groups
      - name: Verify pure source origin
        run: uv run python tools/release_evidence.py verify-source --json
      - name: Run blocking mypy compatibility check
        run: task typecheck-mypy

  typecheck_ty:
    name: Ty compatibility (advisory)
    runs-on: ubuntu-latest
    continue-on-error: true
    env:
      FAST_FSM_BUILD_MODE: pure
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
        with:
          version: "0.12.6"
          python-version: "3.12"
      - name: Install pinned Task runner
        uses: arduino/setup-task@c0bc642852239c2689f73f4ea6459c29405f3c52 # v3.0.0
        with:
          version: "3.53.1"
      - name: Install locked quality dependencies
        run: uv sync --locked --all-groups
      - name: Verify pure source origin
        run: uv run python tools/release_evidence.py verify-source --json
      - name: Run advisory ty compatibility check
        run: task typecheck-ty

  test:
    name: Tests · Python ${{ matrix.python-version }} · ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
        os: [ubuntu-latest, windows-latest, macos-latest]
    env:
      FAST_FSM_BUILD_MODE: pure
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
        with:
          version: "0.12.6"
          python-version: ${{ matrix.python-version }}
      - name: Install pinned Task runner
        uses: arduino/setup-task@c0bc642852239c2689f73f4ea6459c29405f3c52 # v3.0.0
        with:
          version: "3.53.1"
      - name: Install locked test dependencies
        run: uv sync --locked --all-groups
      - name: Verify pure source origin
        run: uv run python tools/release_evidence.py verify-source --json
      - name: Run sequential test suite
        run: task test

  supported_python_build:
    name: Pure sdist build · Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    env:
      FAST_FSM_BUILD_MODE: pure
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
        with:
          version: "0.12.6"
          python-version: ${{ matrix.python-version }}
      - name: Install pinned Task runner
        uses: arduino/setup-task@c0bc642852239c2689f73f4ea6459c29405f3c52 # v3.0.0
        with:
          version: "3.53.1"
      - name: Install locked release build dependencies
        run: uv sync --locked --all-groups
      - name: Verify pure source origin
        run: uv run python tools/release_evidence.py verify-source --json
      - name: Build and inspect pure source distribution
        run: task supported-python-build-check

  evidence:
    name: Pure coverage and release evidence freshness
    runs-on: ubuntu-latest
    env:
      FAST_FSM_BUILD_MODE: pure
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
        with:
          version: "0.12.6"
          python-version: "3.12"
      - name: Install pinned Task runner
        uses: arduino/setup-task@c0bc642852239c2689f73f4ea6459c29405f3c52 # v3.0.0
        with:
          version: "3.53.1"
      - name: Install locked evidence dependencies
        run: uv sync --locked --all-groups
      - name: Verify pure source origin
        run: uv run python tools/release_evidence.py verify-source --json
      - name: Check evidence freshness and source coverage
        run: task release-baseline-check

  docs_html:
    name: Sphinx HTML
    runs-on: ubuntu-latest
    env:
      FAST_FSM_BUILD_MODE: pure
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
        with:
          version: "0.12.6"
          python-version: "3.12"
      - name: Install pinned Task runner
        uses: arduino/setup-task@c0bc642852239c2689f73f4ea6459c29405f3c52 # v3.0.0
        with:
          version: "3.53.1"
      - name: Install locked documentation dependencies
        run: uv sync --locked --all-groups
      - name: Verify pure source origin
        run: uv run python tools/release_evidence.py verify-source --json
      - name: Build Sphinx HTML with warnings as errors
        run: task docs-check

  docs_doctest:
    name: Sphinx doctest
    runs-on: ubuntu-latest
    env:
      FAST_FSM_BUILD_MODE: pure
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
        with:
          version: "0.12.6"
          python-version: "3.12"
      - name: Install pinned Task runner
        uses: arduino/setup-task@c0bc642852239c2689f73f4ea6459c29405f3c52 # v3.0.0
        with:
          version: "3.53.1"
      - name: Install locked documentation dependencies
        run: uv sync --locked --all-groups
      - name: Verify pure source origin
        run: uv run python tools/release_evidence.py verify-source --json
      - name: Run Sphinx doctests
        run: task docs-test

  build_check:
    name: Verify mypyc build
    runs-on: ubuntu-latest
    env:
      FAST_FSM_BUILD_MODE: compiled
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
        with:
          version: "0.12.6"
          python-version: "3.12"
      - name: Install locked build dependencies
        run: uv sync --locked --group release --group dev
      - name: Build mypyc extension
        run: uv run python setup.py build_ext --inplace -q
      - name: Smoke test compiled module
        run: |
          uv run python -c "
          from fast_fsm import StateMachine, State
          sm = StateMachine(State('a'), name='smoke')
          sm.add_state(State('b'))
          sm.add_transition('go', 'a', 'b')
          result = sm.trigger('go')
          assert result.success, 'trigger failed'
          print('Compiled smoke test: OK')
          "

  benchmark:
    name: Benchmark throughput gate
    runs-on: ubuntu-latest
    env:
      FAST_FSM_BUILD_MODE: compiled
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
        with:
          version: "0.12.6"
          python-version: "3.12"
      - name: Install locked benchmark dependencies
        run: uv sync --locked --all-groups
      - name: Build mypyc extension
        run: uv run python setup.py build_ext --inplace -q
      - name: Run throughput regression gate
        run: uv run pytest tests/test_performance_benchmarks.py -m slow -x -q
