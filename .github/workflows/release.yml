name: Release v0.4.0

# This is deliberately the only workflow that can publish. Evidence collection
# lives in release-evidence.yml, which is callable/manual but read-only.
on:
  push:
    tags:
      - "v0.4.0"

permissions:
  contents: read

jobs:
  release_evidence:
    name: Complete hosted release evidence
    uses: ./.github/workflows/release-evidence.yml
    with:
      ref: ${{ github.ref }}
      tag: v0.4.0

  tag_identity:
    name: Bind v0.4.0 tag to accepted aggregate
    needs: [release_evidence]
    runs-on: ubuntu-latest
    env:
      FAST_FSM_BUILD_MODE: pure
      HEAD_SHA: ${{ needs.release_evidence.outputs.head_sha }}
      AGGREGATE_CONCLUSION: ${{ needs.release_evidence.outputs.aggregate_conclusion }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.release_evidence.outputs.head_sha }}
          fetch-depth: 0
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
        with:
          version: "0.12.6"
          python-version: "3.12"
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: ${{ needs.release_evidence.outputs.manifest_artifact }}
          path: evidence
      - name: Require the accepted aggregate and exact peeled tag
        run: |
          # aggregate_conclusion is the reusable terminal aggregate output.
          test "$AGGREGATE_CONCLUSION" = success
          test "$(git rev-parse HEAD)" = "$HEAD_SHA"
          test "$(git rev-parse v0.4.0^{})" = "$HEAD_SHA"
          uv sync --locked --all-groups
          uv run python - <<'PY'
          import json
          import os
          from pathlib import Path

          aggregate = json.loads(Path("evidence/release-manifest.json").read_text())
          if aggregate.get("profile") != "release":
              raise SystemExit("aggregate profile is not release")
          if aggregate.get("authorizes_release") is not True:
              raise SystemExit("aggregate does not authorize release")
          if aggregate.get("release_identity", {}).get("commit") != os.environ["HEAD_SHA"]:
              raise SystemExit("aggregate commit differs from resolved checkout")
          Path("aggregate-identity.json").write_text(
              json.dumps(aggregate["release_identity"], sort_keys=True),
              encoding="utf-8",
          )
          Path("installed-identity.json").write_text(
              '{"distribution_version":"0.4.0","package_version":"0.4.0"}',
              encoding="utf-8",
          )
          PY
          uv run python tools/release_evidence.py verify-release-identity \
            --installed-identity installed-identity.json \
            --aggregate aggregate-identity.json --tag-ref v0.4.0 --json

  github_release:
    name: Create GitHub Release
    needs: [release_evidence, tag_identity]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.release_evidence.outputs.head_sha }}
          fetch-depth: 0
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
        with:
          version: "0.12.6"
          python-version: "3.12"
      - name: Install locked release-manifest verifier dependencies
        run: uv sync --locked --all-groups
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: ${{ needs.release_evidence.outputs.manifest_artifact }}
          path: evidence
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: artifact-*-${{ needs.release_evidence.outputs.head_sha }}
          merge-multiple: true
          path: release-artifacts
      - name: Require an aggregate-approved release manifest
        run: |
          uv run python - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path
          from tools.release_evidence import stage_release_assets

          release_manifest = Path("evidence/release-manifest.json")
          payload = json.loads(release_manifest.read_text())
          digest = hashlib.sha256(release_manifest.read_bytes()).hexdigest()
          if payload.get("release_identity", {}).get("commit") != os.environ["GITHUB_SHA"]:
              raise SystemExit("release manifest commit does not equal tag checkout")
          try:
              stage_release_assets(
                  payload,
                  downloaded=Path("release-artifacts"),
                  staging=Path("release-staging"),
              )
          except Exception as error:
              raise SystemExit(str(error)) from error
          print(f"accepted release-manifest sha256={digest}")
          PY
      - name: Create aggregate-approved release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          files: release-staging/*
          generate_release_notes: true
